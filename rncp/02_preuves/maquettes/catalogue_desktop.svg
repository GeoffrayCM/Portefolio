<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Maquette desktop du catalogue OG Game Challenge</title>
  <desc id="desc">Navigation horizontale, titre central et trois cartes de jeux disposées en colonnes.</desc>
  <rect width="1440" height="900" fill="#f4f4f6"/>
  <rect x="40" y="30" width="1360" height="840" rx="8" fill="#ffffff" stroke="#34343f" stroke-width="3"/>

  <rect x="40" y="30" width="1360" height="110" rx="8" fill="#e5e5ea"/>
  <rect x="75" y="58" width="145" height="54" rx="4" fill="#ffffff" stroke="#34343f" stroke-width="3"/>
  <text x="147" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#24242d">LOGO</text>
  <text x="540" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24242d">ACCUEIL</text>
  <text x="720" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24242d">JEUX</text>
  <line x1="675" y1="108" x2="765" y2="108" stroke="#6d36b3" stroke-width="4"/>
  <text x="930" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24242d">CLASSEMENT</text>
  <rect x="1190" y="65" width="160" height="40" rx="4" fill="#ffffff" stroke="#34343f" stroke-width="2"/>
  <text x="1270" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#24242d">UTILISATEUR</text>

  <text x="720" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#24242d">CHOISISSEZ VOTRE DÉFI</text>
  <text x="720" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#62626d">Choisissez un jeu, battez les records, devenez une légende.</text>

  <g font-family="Arial, sans-serif" fill="#24242d">
    <g transform="translate(95 315)">
      <rect width="380" height="455" rx="6" fill="#fafafa" stroke="#5a5a65" stroke-width="3"/>
      <rect x="20" y="20" width="340" height="190" fill="#d9d9df"/>
      <line x1="20" y1="20" x2="360" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <line x1="360" y1="20" x2="20" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <text x="30" y="260" font-size="24" font-weight="700">Dodge Runner</text>
      <text x="30" y="295" font-size="15" fill="#62626d">Éviter les obstacles et survivre.</text>
      <rect x="30" y="335" width="320" height="45" rx="4" fill="#34343f"/>
      <text x="190" y="364" text-anchor="middle" font-size="16" fill="#ffffff">JOUER</text>
      <rect x="30" y="392" width="320" height="42" rx="4" fill="#ffffff" stroke="#6d36b3" stroke-width="2"/>
      <text x="190" y="419" text-anchor="middle" font-size="15" fill="#53258e">CLASSEMENT</text>
    </g>
    <g transform="translate(530 315)">
      <rect width="380" height="455" rx="6" fill="#fafafa" stroke="#5a5a65" stroke-width="3"/>
      <rect x="20" y="20" width="340" height="190" fill="#d9d9df"/>
      <line x1="20" y1="20" x2="360" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <line x1="360" y1="20" x2="20" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <text x="30" y="260" font-size="24" font-weight="700">Platformer Escape</text>
      <text x="30" y="295" font-size="15" fill="#62626d">Franchir les plateformes jusqu'à la sortie.</text>
      <rect x="30" y="335" width="320" height="45" rx="4" fill="#34343f"/>
      <text x="190" y="364" text-anchor="middle" font-size="16" fill="#ffffff">JOUER</text>
      <rect x="30" y="392" width="320" height="42" rx="4" fill="#ffffff" stroke="#6d36b3" stroke-width="2"/>
      <text x="190" y="419" text-anchor="middle" font-size="15" fill="#53258e">CLASSEMENT</text>
    </g>
    <g transform="translate(965 315)">
      <rect width="380" height="455" rx="6" fill="#fafafa" stroke="#5a5a65" stroke-width="3"/>
      <rect x="20" y="20" width="340" height="190" fill="#d9d9df"/>
      <line x1="20" y1="20" x2="360" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <line x1="360" y1="20" x2="20" y2="210" stroke="#b3b3bc" stroke-width="2"/>
      <text x="30" y="260" font-size="24" font-weight="700">Space Runner</text>
      <text x="30" y="295" font-size="15" fill="#62626d">Combattre et obtenir le meilleur score.</text>
      <rect x="30" y="335" width="320" height="45" rx="4" fill="#34343f"/>
      <text x="190" y="364" text-anchor="middle" font-size="16" fill="#ffffff">JOUER</text>
      <rect x="30" y="392" width="320" height="42" rx="4" fill="#ffffff" stroke="#6d36b3" stroke-width="2"/>
      <text x="190" y="419" text-anchor="middle" font-size="15" fill="#53258e">CLASSEMENT</text>
    </g>
  </g>

  <text x="70" y="840" font-family="Arial, sans-serif" font-size="14" fill="#62626d">Maquette fonctionnelle reconstituée — version desktop</text>
</svg>
