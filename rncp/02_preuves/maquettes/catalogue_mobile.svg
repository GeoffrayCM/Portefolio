<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc">
  <title id="title">Maquette mobile du catalogue OG Game Challenge</title>
  <desc id="desc">Navigation sur deux lignes et cartes de jeux empilées sur une colonne.</desc>
  <rect width="430" height="932" fill="#f4f4f6"/>
  <rect x="15" y="15" width="400" height="902" rx="24" fill="#ffffff" stroke="#34343f" stroke-width="3"/>

  <rect x="15" y="15" width="400" height="145" rx="24" fill="#e5e5ea"/>
  <rect x="38" y="38" width="105" height="45" rx="4" fill="#ffffff" stroke="#34343f" stroke-width="2"/>
  <text x="90" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#24242d">LOGO</text>
  <rect x="286" y="42" width="100" height="36" rx="4" fill="#ffffff" stroke="#34343f" stroke-width="2"/>
  <text x="336" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#24242d">PROFIL</text>
  <text x="83" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#24242d">ACCUEIL</text>
  <text x="212" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#24242d">JEUX</text>
  <line x1="182" y1="140" x2="242" y2="140" stroke="#6d36b3" stroke-width="4"/>
  <text x="342" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#24242d">CLASSEMENT</text>

  <text x="215" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#24242d">CHOISISSEZ</text>
  <text x="215" y="249" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6d36b3">VOTRE DÉFI</text>
  <text x="215" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#62626d">Choisissez un jeu et battez les records.</text>

  <g font-family="Arial, sans-serif" fill="#24242d">
    <g transform="translate(45 315)">
      <rect width="340" height="240" rx="6" fill="#fafafa" stroke="#5a5a65" stroke-width="2"/>
      <rect x="15" y="15" width="125" height="95" fill="#d9d9df"/>
      <line x1="15" y1="15" x2="140" y2="110" stroke="#b3b3bc"/>
      <line x1="140" y1="15" x2="15" y2="110" stroke="#b3b3bc"/>
      <text x="158" y="48" font-size="18" font-weight="700">Dodge Runner</text>
      <text x="158" y="75" font-size="12" fill="#62626d">Éviter les obstacles</text>
      <text x="158" y="94" font-size="12" fill="#62626d">et survivre.</text>
      <rect x="15" y="135" width="310" height="38" rx="4" fill="#34343f"/>
      <text x="170" y="160" text-anchor="middle" font-size="13" fill="#ffffff">JOUER</text>
      <rect x="15" y="187" width="310" height="36" rx="4" fill="#ffffff" stroke="#6d36b3" stroke-width="2"/>
      <text x="170" y="210" text-anchor="middle" font-size="12" fill="#53258e">CLASSEMENT</text>
    </g>
    <g transform="translate(45 580)">
      <rect width="340" height="240" rx="6" fill="#fafafa" stroke="#5a5a65" stroke-width="2"/>
      <rect x="15" y="15" width="125" height="95" fill="#d9d9df"/>
      <line x1="15" y1="15" x2="140" y2="110" stroke="#b3b3bc"/>
      <line x1="140" y1="15" x2="15" y2="110" stroke="#b3b3bc"/>
      <text x="158" y="48" font-size="18" font-weight="700">Platformer</text>
      <text x="158" y="70" font-size="18" font-weight="700">Escape</text>
      <text x="158" y="96" font-size="12" fill="#62626d">Atteindre la sortie.</text>
      <rect x="15" y="135" width="310" height="38" rx="4" fill="#34343f"/>
      <text x="170" y="160" text-anchor="middle" font-size="13" fill="#ffffff">JOUER</text>
      <rect x="15" y="187" width="310" height="36" rx="4" fill="#ffffff" stroke="#6d36b3" stroke-width="2"/>
      <text x="170" y="210" text-anchor="middle" font-size="12" fill="#53258e">CLASSEMENT</text>
    </g>
  </g>

  <text x="215" y="868" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#62626d">Défilement vertical : carte Space Runner ensuite</text>
  <text x="215" y="894" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#62626d">Maquette reconstituée — version mobile</text>
</svg>
